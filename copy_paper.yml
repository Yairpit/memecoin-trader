name: copy-paper

on:
  schedule:
    - cron: "0 */6 * * *"      # arranca un turno nuevo cada 6 horas
  workflow_dispatch:            # tambien se puede lanzar a mano desde la pestana Actions

concurrency:
  group: copy-paper
  cancel-in-progress: false

permissions:
  contents: write               # para guardar copy_state.json y copy_trades.csv en el repo
  actions: write                # para relanzar el siguiente turno enseguida

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Correr bot (turno de ~5h45)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          MAX_RUN_MINUTES: "345"
        run: python copy_paper.py

      - name: Guardar estado en el repo
        if: always()
        run: |
          git config user.name "copy-bot"
          git config user.email "copy-bot@users.noreply.github.com"
          git add copy_state.json copy_trades.csv || true
          git commit -m "estado $(date -u +%Y-%m-%d_%H:%M)" || echo "sin cambios"
          git pull --rebase || true
          git push || true

      - name: Relanzar el siguiente turno enseguida (sin esperar al cron)
        if: success() || failure()   # si cancelas a mano, NO se relanza
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run copy_paper.yml --ref ${{ github.ref_name }} || true
